/* Scope grouping and progressive disclosure */
:root{--inherited:#E6BE32}
.workspace{grid-template-columns:205px minmax(0,1fr) var(--right-panel-width)}
.scope-summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 14px}.scope-summary label{align-items:flex-start;line-height:1.4}.scope-summary .dot{flex-shrink:0;margin-top:3px}
.scope-tables{display:grid;gap:10px}.scope-section{border:1px solid var(--line);border-left:4px solid var(--scope-color);border-radius:7px;overflow:hidden}
.scope-section>summary,.aggregate-section>summary{cursor:pointer;display:flex;align-items:flex-start;gap:8px;padding:12px 10px;list-style:none}
.scope-section>summary::-webkit-details-marker,.aggregate-section>summary::-webkit-details-marker{display:none}
.scope-section>summary:before,.aggregate-section>summary:before{content:'▸';color:#627287;flex:0 0 10px}.scope-section[open]>summary:before,.aggregate-section[open]>summary:before{content:'▾'}
.scope-section>summary{background:#f8fafc;font-size:12px;font-weight:650}.scope-section>summary strong,.aggregate-section>summary strong{margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.scope-name{min-width:0}.scope-name>.dot{margin-right:5px}.scope-name small,.aggregate-section summary small{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-top:3px}
.scope-content{padding:0 8px 8px}.aggregate-section{border-top:1px solid var(--line);margin-top:7px}.aggregate-section>summary{font-size:11px;padding:11px 2px}.aggregate-section>summary span{overflow-wrap:anywhere}
.aggregate-section table{table-layout:fixed}.aggregate-section th{position:static;font-size:10px}.aggregate-section th:last-child{width:27%}.aggregate-section td:first-child{overflow-wrap:anywhere}.aggregate-section td:last-child{white-space:normal;overflow-wrap:anywhere}
.show-graph{font-size:10px;padding:5px 8px;margin:0 0 8px 17px;border:1px solid #ccd7e3;background:white;border-radius:4px;color:#365678}.show-graph[aria-pressed=true]{background:#eaf0f7}
.empty-scope{font-size:11px;color:var(--muted);padding:8px 5px;margin:0}.results{max-height:none}
@media(min-width:1750px){.workspace{grid-template-columns:225px minmax(0,1fr) var(--right-panel-width)}}
@media(max-width:1150px){.workspace{grid-template-columns:185px minmax(0,1fr) var(--right-panel-width)}}
@media(max-width:880px){.workspace{grid-template-columns:185px minmax(0,1fr)}.results{grid-column:1/-1}.scope-summary{max-width:none}.scope-tables{grid-template-columns:1fr 1fr;align-items:start}}
@media(max-width:550px){.workspace{display:block}.scope-tables{grid-template-columns:1fr}.scope-summary{grid-template-columns:1fr 1fr}}

'use strict';
// Compact layout: unique branch angles, measured label boxes and reserved flow directions.
const CompactLayout = (() => {
  const radians=Math.PI/180;
  const box=(x,y,w,h)=>({left:x-w/2,right:x+w/2,top:y-h/2,bottom:y+h/2});
  const bounds=boxes=>({left:Math.min(...boxes.map(b=>b.left)),right:Math.max(...boxes.map(b=>b.right)),top:Math.min(...boxes.map(b=>b.top)),bottom:Math.max(...boxes.map(b=>b.bottom))});
  const overlap=(a,b,gap=4)=>a.left<b.right+gap&&a.right+gap>b.left&&a.top<b.bottom+gap&&a.bottom+gap>b.top;
  function crosses(a,b,r,pad=3){
    let lo=0,hi=1;const dx=b.x-a.x,dy=b.y-a.y;
    for(const [p,q] of [[-dx,a.x-r.left+pad],[dx,r.right+pad-a.x],[-dy,a.y-r.top+pad],[dy,r.bottom+pad-a.y]]){
      if(Math.abs(p)<1e-10){if(q<0)return false;}
      else{const t=q/p;if(p<0)lo=Math.max(lo,t);else hi=Math.min(hi,t);if(lo>hi)return false;}
    }
    return true;
  }
  function wrap(text,width,size,measure,max=3){
    const words=String(text).trim().split(/\s+/);let lines=[],line='';
    for(const word of words){
      if(measure(word,size)>width){
        if(line){lines.push(line);line='';}
        let part='';for(const ch of word){if(part&&measure(part+ch,size)>width){lines.push(part);part=ch;}else part+=ch;}line=part;
      }else if(line&&measure(line+' '+word,size)>width){lines.push(line);line=word;}

    return lines.length?lines:[''];
  }
  function sourceNode(group,angle,radius,measure){
    const x=Math.cos(angle)*radius,y=Math.sin(angle)*radius;
    const lines=wrap(group.label,84,12,measure),w=Math.max(...lines.map(t=>measure(t,12)))+4,h=lines.length*14;
    // Place text outside the dot along the same angle, keeping the original font size.
    const ux=Math.cos(angle),uy=Math.sin(angle);
    const offset=Math.min((w/2+13)/Math.max(Math.abs(ux),1e-9),(h/2+13)/Math.max(Math.abs(uy),1e-9));

 ctx.font=`${size}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;

    const groups=stages.map(s=>{
      const map=new Map();for(const r of records.filter(r=>r.stage_id===s.id)){
        const key=JSON.stringify([s.id,r.scope,r.aggregate]);if(!map.has(key))map.set(key,{type:'emission',key,id:key,stage:s.id,label:r.aggregate,scope:r.scope,members:[]});map.get(key).members.push(r);
      }

      const nodePos=new Map(graphNodes.map(p=>[p.id,p]));
      const shiftBox=(b,x,y)=>({left:b.left+x,right:b.right+x,top:b.top+y,bottom:b.bottom+y});

        const c=nodePos.get(s.id),next=s.next_ids.map(id=>nodePos.get(id));
        let x,y,vertical=false;
        if(next.length===1){x=(c.x+next[0].x)/2;y=(c.y+next[0].y)/2;vertical=Math.abs(c.x-next[0].x)<1;}
        else if(next.length){x=c.x+cw/2;y=c.y;}
        else{x=c.x;y=c.y+localBounds[i].bottom+45;}
        const lines=wrap(productLabel(s),110,11,measure),w=Math.max(...lines.map(t=>measure(t,11)))+4,h=lines.length*13;
        const labelX=vertical?x+22+w/2:x,labelY=vertical?y:y+24+h/2;
        return {type:'product',key:'p:'+s.id,id:s.id,stage:s.id,label:s.output_product,x,y,r:15,labelX,labelY,labelLines:lines,labelBox:box(labelX,labelY,w,h)};
      });
      const flows=[];for(const p of productNodes){
        flows.push({source:p.stage,target:null,a:nodePos.get(p.stage),b:p});
        for(const t of stages.find(s=>s.id===p.stage).next_ids)flows.push({source:p.stage,target:t,a:p,b:nodePos.get(t)});
      }
      const labels=[...emissionNodes,...productNodes].map(p=>p.labelBox);
      let clean=true;
      for(let i=0;i<labels.length&&clean;i++)for(let j=0;j<i;j++)if(overlap(labels[i],labels[j],4)){clean=false;break;}

      for(const f of flows){if(!clean)break;for(const p of productNodes)if(crosses(f.a,f.b,p.labelBox,3)){clean=false;break;}}

      if(clean)break;

      if(p.labelBox){p.labelX+=dx;p.labelY+=dy;for(const k of ['left','right'])p.labelBox[k]+=dx;for(const k of ['top','bottom'])p.labelBox[k]+=dy;}

  }

})();

    const groups=result.groups.filter(g=>g.category===c.key),summary=result.by_category[c.key];
    return `<details class="scope-section" data-scope="${c.key}" ${openScopes.has(c.key)?'open':''} style="--scope-color:${c.color}">
      <summary><span class="scope-name"><i class="dot" style="--c:${c.color}"></i>${esc(c.label)}<small>${summary.count} source${summary.count===1?'':'s'}</small></span><strong>${sumLabel(summary)}</strong></summary>
      <div class="scope-content">${groups.map(g=>{
        const idx=result.groups.indexOf(g),k=groupKey(g);
        const table=`<table><thead><tr><th>Source</th><th>Emissions</th></tr></thead><tbody>${result.rows.filter(r=>g.ids.includes(r.id)).map(rawRow).join('')}</tbody></table>`;
        return `<details class="aggregate-section" data-group="${idx}" ${openGroups.has(k)?'open':''}>
          <summary><span>${esc(g.name)}<small>${esc(stages.get(g.stage_id).label)} · ${g.count} source${g.count===1?'':'s'}</small></span><strong>${sumLabel(g)}</strong></summary>
          ${table}
        </details>`;
      }).join('')||'<p class="empty-scope">No elements included in this scope.</p>'}</div></details>`;
  }).join('');
  $('scope-tables').querySelectorAll('[data-scope]').forEach(d=>d.addEventListener('toggle',()=>{if(!d.isConnected)return;if(d.open)openScopes.add(d.dataset.scope);else openScopes.delete(d.dataset.scope);}));
  $('scope-tables').querySelectorAll('[data-group]').forEach(d=>d.addEventListener('toggle',()=>{if(!d.isConnected)return;const k=groupKey(result.groups[Number(d.dataset.group)]);if(d.open)openGroups.add(k);else openGroups.delete(k);}));
}

function buildLayout(){
 const measure=(text,size)=>{ctx.font=`${size}px system-ui,sans-serif`;return ctx.measureText(text).width;};
 layoutInfo=CompactLayout.build(DATA.stages,DATA.records,measure,ROW_GAP_PX);
 ({graphNodes,nodePos,emissionNodes,productNodes,world}=layoutInfo);
}
function emissionState(p){const included=p.members.filter(r=>highlighted.has(r.location_id));if(!included.length)return null;return {scope:p.stage===selected?included[0].scope:3,inherited:p.stage!==selected,rows:included};}
function drawSoon(){if(!queued){queued=true;requestAnimationFrame(()=>{queued=false;draw();});}}
function resize(){const r=wrap.getBoundingClientRect();width=r.width-2;height=r.height-2;const d=devicePixelRatio||1;canvas.width=Math.round(width*d);canvas.height=Math.round(height*d);drawSoon();}
function fit(){view.k=Math.min((width-15)/world.width,(height-22)/world.height,1.5);view.x=(width-world.width*view.k)/2;view.y=(height-world.height*view.k)/2;drawSoon();}
function zoom(f,cx=width/2,cy=height/2){const k=Math.max(.2,Math.min(5,view.k*f));view.x=cx-(cx-view.x)*k/view.k;view.y=cy-(cy-view.y)*k/view.k;view.k=k;drawSoon();}
function circle(p,r,fill,stroke,w=1){ctx.beginPath();ctx.arc(p.x,p.y,r,0,2*Math.PI);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.stroke();}}
function line(a,b,color,width=1,arrow=true){const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy);if(l<1)return;const ux=dx/l,uy=dy/l,start={x:a.x+ux*(a.r+4),y:a.y+uy*(a.r+4)},end={x:b.x-ux*(b.r+6),y:b.y-uy*(b.r+6)};ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.moveTo(start.x,start.y);ctx.lineTo(end.x,end.y);ctx.stroke();if(arrow){ctx.beginPath();ctx.fillStyle=color;ctx.moveTo(end.x,end.y);ctx.lineTo(end.x-ux*6-uy*3,end.y-uy*6+ux*3);ctx.lineTo(end.x-ux*6+uy*3,end.y-uy*6-ux*3);ctx.closePath();ctx.fill();}}
function label(txt,x,y,w,color,size=13,max=3){ctx.font=`${size}px system-ui,sans-serif`;let lines=[],line='';for(const word of txt.split(/\s+/)){const next=line?line+' '+word:word;if(ctx.measureText(next).width>w&&line){lines.push(line);line=word;}else line=next;}if(line)lines.push(line);if(lines.length>max){lines=lines.slice(0,max);lines[max-1]+='…';}ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;lines.forEach((l,i)=>ctx.fillText(l,x,y+(i-(lines.length-1)/2)*(size+2)));}
function drawTextLines(lines,x,y,color,size){
 ctx.font=`${size}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;
 lines.forEach((text,i)=>ctx.fillText(text,x,y+(i-(lines.length-1)/2)*(size+2)));
}
function productLabel(p){if(p.label==='Palm-containing intermediate product / specialty oils and fats')return 'Intermediate / specialty oils & fats';return p.label;}
function draw(){
 if(!result)return;const dpi=devicePixelRatio||1;ctx.setTransform(dpi,0,0,dpi,0,0);ctx.clearRect(0,0,width,height);ctx.translate(view.x,view.y);ctx.scale(view.k,view.k);
 for(const p of productNodes){const s=stages.get(p.stage),a=nodePos.get(p.stage),active=p.stage===selected||upstream.has(p.stage);line(a,p,active?'#9caeb9':'#d4dce5',active?1.4:1);for(const t of s.next_ids)line(p,nodePos.get(t),activeFlows.has(pair(s.id,t))?colors.inherited:'#d4dce5',activeFlows.has(pair(s.id,t))?1.7:1);}
 for(const p of emissionNodes){const c=nodePos.get(p.stage),state=emissionState(p);ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(p.x,p.y);ctx.strokeStyle=state?(state.inherited?colors.inherited:colors[state.scope]):'#e2e7ee';ctx.lineWidth=state?1.3:1;ctx.setLineDash(state?.inherited?[4,4]:[]);ctx.stroke();ctx.setLineDash([]);}
 for(const p of emissionNodes){const state=emissionState(p),focus=p.members.some(r=>focused.has(r.id));if(focus||hover===p.key)circle(p,13,'#edf1f6','#99a7b6');if(state?.inherited){ctx.setLineDash([3,2]);circle(p,7,soft.inherited,colors.inherited,1.8);ctx.setLineDash([]);}else circle(p,state?7:5,state?colors[state.scope]:'#d9e1ea');drawTextLines(p.labelLines,p.labelX,p.labelY,state?'#394b5d':'#95a3b4',12);}
 for(const p of graphNodes){const sel=p.id===selected,ancestor=upstream.has(p.id);if(sel)circle(p,40,'#e9eef5');else if(hover===p.key)circle(p,39,'#f0f3f7');circle(p,33,sel?'#243348':ancestor?soft.inherited:'#f7f9fb',sel?'#243348':ancestor?colors.inherited:'#c6d0dd',1.2);label(p.label,p.x,p.y,66,sel?'white':ancestor?'#806600':'#617489',11,4);}
 for(const p of productNodes){const active=p.stage===selected||upstream.has(p.stage);ctx.beginPath();ctx.moveTo(p.x,p.y-15);ctx.lineTo(p.x+15,p.y);ctx.lineTo(p.x,p.y+15);ctx.lineTo(p.x-15,p.y);ctx.closePath();ctx.fillStyle=active?'#eef3f8':'white';ctx.fill();ctx.strokeStyle=active?'#7c8fa4':'#c7d0dc';ctx.lineWidth=hover===p.key?2.3:1.2;ctx.stroke();drawTextLines(p.labelLines,p.labelX,p.labelY,active?'#40526a':'#8493a5',11);}
}
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left-view.x)/view.k,y:(e.clientY-r.top-view.y)/view.k,sx:e.clientX-r.left,sy:e.clientY-r.top};}
function hit(q){let best=null,distance=Infinity;for(const p of [...emissionNodes,...productNodes,...graphNodes]){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<Math.max(p.r+4,11/view.k)&&d<distance){best=p;distance=d;}}return best;}
function tip(p,q){if(!p){$('tip').style.display='none';return;}let body='';if(p.type==='stage')body='Click to select this stage.';else if(p.type==='product')body=`Output of ${stages.get(p.stage).label}. Product diamonds add no emissions.`;else{const st=emissionState(p);body=`${esc(stages.get(p.stage).label)} · ${p.members.length} source(s)${st?' · Scope '+st.scope+(st.inherited?' Upstream (Inherited)':' local'):' · Outside current selection'}`;body+='<br>'+p.members.map(r=>esc(r.raw)+': '+fmt(r.emissions)+' '+esc(DATA.unit)).join('<br>');}$('tip').innerHTML=`${esc(p.label)}<small>${p.type==='emission'?body:esc(body)}</small>`;$('tip').style.display='block';const w=$('tip').offsetWidth,h=$('tip').offsetHeight;$('tip').style.left=Math.max(6,Math.min(width-w-6,q.sx+13))+'px';$('tip').style.top=Math.max(6,Math.min(height-h-6,q.sy+14))+'px';}
function inspect(p){lastInspected=p;if(p.type==='product'){$('detail').innerHTML=`<b>${esc(p.label)}</b><p>Output of ${esc(stages.get(p.stage).label)}. No additional emissions are assigned to the product diamond.</p>`;return;}focused=new Set(p.members.map(r=>r.id));for(const g of result.groups){if(g.ids.some(id=>focused.has(id))){openScopes.add(g.category);openGroups.add(groupKey(g));}}$('detail').innerHTML=`<b>${esc(p.label)} / ${esc(stages.get(p.stage).label)}</b>`+p.members.map(r=>`<p>${esc(r.raw)}: ${fmt(r.emissions)} ${esc(DATA.unit)}<br>Recorded Scope ${r.scope}${showNotes&&r.notes?'<br>'+esc(r.notes):''}</p>`).join('');renderTable();drawSoon();}
canvas.addEventListener('pointerdown',e=>{const q=point(e);drag={start:q,last:q,moved:false};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{const q=point(e);if(drag){const dx=q.sx-drag.last.sx,dy=q.sy-drag.last.sy;if(Math.hypot(q.sx-drag.start.sx,q.sy-drag.start.sy)>4)drag.moved=true;if(drag.moved){view.x+=dx;view.y+=dy;canvas.style.cursor='grabbing';$('tip').style.display='none';drawSoon();}drag.last=q;}else{const p=hit(q);hover=p?.key||null;canvas.style.cursor=p?'pointer':'grab';tip(p,q);drawSoon();}});
canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved){const p=hit(point(e));if(p?.type==='stage')selectStage(p.id);else if(p)inspect(p);}drag=null;canvas.style.cursor='grab';});
canvas.addEventListener('pointercancel',()=>{drag=null;});canvas.addEventListener('pointerleave',()=>{hover=null;$('tip').style.display='none';drawSoon();});
canvas.addEventListener('wheel',e=>{e.preventDefault();const q=point(e);zoom(Math.exp(-e.deltaY*.001),q.sx,q.sy);},{passive:false});
$('zoom-in').addEventListener('click',()=>zoom(1.3));$('zoom-out').addEventListener('click',()=>zoom(1/1.3));$('fit').addEventListener('click',()=>fit());
new ResizeObserver(()=>{resize();fit();}).observe(wrap);
window.scopeExplorer={getData:()=>DATA,getState:()=>({selected,scenario,detail,result,showNotes}),select:(id,sc=scenario)=>{if(!['A','B','C'].includes(sc))throw Error('Unknown scenario');scenario=sc;selectStage(id);},positions:()=>({graphNodes,emissionNodes,productNodes,view,world,radius:layoutInfo.radius,rowSpacing:layoutInfo.rowSpacing}),colors};
buildLayout();update();resize();fit();



</script></body></html>
